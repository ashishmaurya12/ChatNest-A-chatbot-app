<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ChatNest AI Platform</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card glass-morphism">
      <!-- Logo Header -->
      <div class="auth-header">
        <div class="brand-logo">
          <svg width="42" height="42" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="10" fill="url(#logo-grad-reg)"/>
            <path d="M10 14C10 11.7909 11.7909 10 14 10H22C24.2091 10 26 11.7909 26 14V20C26 22.2091 24.2091 24 22 24H15L10 27V14Z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="15" cy="17" r="1.5" fill="white"/>
            <circle cx="18" cy="17" r="1.5" fill="white"/>
            <circle cx="21" cy="17" r="1.5" fill="white"/>
            <defs>
              <linearGradient id="logo-grad-reg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366F1"/>
                <stop offset="1" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-name">ChatNest</span>
        </div>
        <h2>Create an Account</h2>
        <p class="auth-subtitle">Join ChatNest to start chatting with AI models in real time.</p>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="auth-alert hidden"></div>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="name" placeholder="Alex Morgan" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader hidden"></span>
        </button>

        <div class="auth-divider" style="display: flex; align-items: center; text-align: center; margin: 1.25rem 0; color: var(--text-dim); font-size: 0.8rem; font-weight: 500;">
          <span style="flex: 1; border-bottom: 1px solid var(--border-color);"></span>
          <span style="padding: 0 0.75rem;">OR</span>
          <span style="flex: 1; border-bottom: 1px solid var(--border-color);"></span>
        </div>

        <button type="button" id="googleAuthBtn" class="btn btn-secondary btn-full" style="display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.75rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span>Continue with Google</span>
        </button>
      </form>

      <!-- Footer Link -->
      <div class="auth-footer">
        <p>Already have an account? <a href="index.html">Sign In</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
