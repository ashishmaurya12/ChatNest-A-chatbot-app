<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in or sign up - ChatNest AI</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Google Identity Services SDK for One-Tap -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=14.0.0">
</head>
<body class="auth-page chatgpt-auth-style">
  <div class="auth-container">
    <div class="auth-card glass-morphism" style="max-width: 420px; border-radius: 24px; padding: 2.5rem 2rem;">
      <!-- Logo Header -->
      <div class="auth-header" style="margin-bottom: 1.5rem;">
        <div class="brand-logo" style="justify-content: center; margin-bottom: 1rem;">
          <svg width="42" height="42" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="10" fill="url(#logo-grad)"/>
            <path d="M10 14C10 11.7909 11.7909 10 14 10H22C24.2091 10 26 11.7909 26 14V20C26 22.2091 24.2091 24 22 24H15L10 27V14Z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="15" cy="17" r="1.5" fill="white"/>
            <circle cx="18" cy="17" r="1.5" fill="white"/>
            <circle cx="21" cy="17" r="1.5" fill="white"/>
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366F1"/>
                <stop offset="1" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-name" style="font-size: 1.5rem;">ChatNest</span>
        </div>
        <h2 style="font-size: 1.85rem; font-weight: 700; text-align: center; margin-bottom: 0.4rem;">Log in or sign up</h2>
        <p class="auth-subtitle" style="text-align: center; font-size: 0.9rem;">Choose your preferred method to access ChatNest AI.</p>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="auth-alert hidden"></div>

      <!-- Social Options Group (ChatGPT Style Pill Buttons) -->
      <div class="social-pill-group" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem;">
        <button type="button" id="googleAuthBtn" class="pill-social-btn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.75rem; padding:0.8rem 1.25rem; border-radius:9999px; background:var(--bg-card); border:1px solid var(--border-color); color:var(--text-main); font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.2s ease;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span>Continue with Google</span>
        </button>

        <button type="button" id="appleAuthBtn" class="pill-social-btn apple-btn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.75rem; padding:0.8rem 1.25rem; border-radius:9999px; background:var(--bg-card); border:1px solid var(--border-color); color:var(--text-main); font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.2s ease;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.36c.64-.78 1.08-1.85.96-2.92-.93.04-2.07.62-2.74 1.4-.59.69-1.11 1.79-.97 2.85 1.05.08 2.11-.55 2.75-1.33z"/></svg>
          <span>Continue with Apple</span>
        </button>

        <button type="button" id="phoneAuthBtn" class="pill-social-btn phone-btn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.75rem; padding:0.8rem 1.25rem; border-radius:9999px; background:var(--bg-card); border:1px solid var(--border-color); color:var(--text-main); font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.2s ease;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span>Continue with phone</span>
        </button>
      </div>

      <div class="auth-divider" style="display: flex; align-items: center; text-align: center; margin: 1.25rem 0; color: var(--text-dim); font-size: 0.8rem; font-weight: 600; letter-spacing: 1px;">
        <span style="flex: 1; border-bottom: 1px solid var(--border-color);"></span>
        <span style="padding: 0 0.85rem;">OR</span>
        <span style="flex: 1; border-bottom: 1px solid var(--border-color);"></span>
      </div>

      <!-- Login / Signup Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="Email address" required autocomplete="email" style="border-radius: 9999px; padding: 0.85rem 1.25rem;">
          </div>
        </div>

        <div class="form-group" id="passwordGroup">
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password" style="border-radius: 9999px; padding: 0.85rem 1.25rem;">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-full" style="border-radius: 9999px; background: #ffffff; color: #000000; font-weight: 700; padding: 0.85rem; margin-top: 0.5rem;">
          <span class="btn-text">Continue</span>
          <span class="btn-loader hidden"></span>
        </button>
      </form>

      <!-- Footer Link -->
      <div class="auth-footer" style="margin-top: 1.5rem; text-align: center;">
        <p><a href="chat.html" style="color: var(--text-muted); text-decoration: underline; font-size: 0.9rem;">Try it first</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=14.0.0"></script>
  <script src="js/auth.js?v=14.0.0"></script>
</body>
</html>
