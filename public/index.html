<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ChatNest AI Platform</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card glass-morphism">
      <!-- Logo Header -->
      <div class="auth-header">
        <div class="brand-logo">
          <svg width="42" height="42" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="10" fill="url(#logo-grad)"/>
            <path d="M10 14C10 11.7909 11.7909 10 14 10H22C24.2091 10 26 11.7909 26 14V20C26 22.2091 24.2091 24 22 24H15L10 27V14Z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="15" cy="17" r="1.5" fill="white"/>
            <circle cx="18" cy="17" r="1.5" fill="white"/>
            <circle cx="21" cy="17" r="1.5" fill="white"/>
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366F1"/>
                <stop offset="1" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-name">ChatNest</span>
        </div>
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Log in to your ChatNest account to access your AI threads.</p>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="auth-alert hidden"></div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
          </div>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader hidden"></span>
        </button>
      </form>

      <!-- Footer Link -->
      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
